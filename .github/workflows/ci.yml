name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04
    env: { LLVM_SYS_221_PREFIX: /usr/lib/llvm-22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q && sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 libzstd-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # Includes the hosted tests that build against and compare with the
      # CPython found as `python3` (the oracle). Skipped: the static-libpython
      # tests (need a relocatable CPython with a PIC `libpython3.X.a`) and the
      # nbody speed gate (timing on a shared runner).
      - run: >-
          cargo test --release --workspace -- --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      # Real-world gate: every corpus program must compile in non-strict mode and
      # print exactly what CPython prints (wrong output = miscompilation).
      - run: python3 bench/corpus.py -j 4 --flags=--non-strict --require-correct
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # Homebrew's keg-only llvm@22 (static LLVM libraries; llvm-sys links them).
      - name: Install LLVM 22
        run: |
          brew install llvm@22
          prefix=$(brew --prefix llvm@22)
          "$prefix/bin/llvm-config" --version
          "$prefix/bin/llvm-config" --system-libs --link-static
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Show the driver's dynamic dependencies
        run: otool -L target/release/pycc
      # Same skips as the Linux job, for the same reasons.
      - run: >-
          cargo test --release --workspace -- --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      - run: python3 bench/corpus.py -j 4 --flags=--non-strict --require-correct
