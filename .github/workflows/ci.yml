name: ci
on:
  push: { branches: [main] }
  pull_request:
  # A manual run (e.g. of a branch); `windows_only` skips the Linux and macOS
  # jobs, to iterate on the Windows job alone.
  workflow_dispatch:
    inputs:
      windows_only: { type: boolean, default: false, description: "Run only the Windows job" }
permissions: { contents: read }
jobs:
  test:
    # Linux x86_64 and aarch64 (GitHub's arm64 runner); the same LLVM, tests
    # and corpus gate on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    if: ${{ !inputs.windows_only }}
    runs-on: ${{ matrix.os }}
    env: { LLVM_SYS_221_PREFIX: /usr/lib/llvm-22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # numpy for the hosted numpy tests and benchmarks, pinned by version and
      # wheel hash.
      - run: "python3 -m pip install --only-binary=:all: --require-hashes -r .github/numpy-requirements.txt"
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q && sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 libzstd-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # Lints: every clippy finding in every crate and target fails the job.
      - name: Clippy
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rustup component add clippy
          cargo clippy --release --workspace --all-targets -- -D warnings
      # The release archive as release.yml builds it (no tag here), unpacked
      # and smoke-tested, so a packaging break shows up before a release.
      - name: Package and smoke-test the release archive
        run: |
          name=pycc-ci-$(uname -m)-linux
          scripts/package.sh dist/$name
          tar -C dist -czf dist/$name.tar.gz $name
          smoke=$(mktemp -d)
          tar -C "$smoke" -xzf dist/$name.tar.gz
          file "$smoke/$name/bin/pycc"
          scripts/smoke.sh "$smoke/$name"
      # `pip install` builds with pycc (v0.6 accept 1): each real package's wheel
      # is built by `pip wheel` through the archive's PEP 517 backend
      # (python/pycc_build-*.whl, installed into pip's isolated build
      # environment with no index) and its bin/pycc, installed into a fresh
      # venv, checked to hold extension modules, and the package's own test
      # suite runs against the installed wheel. The pyproject.toml selecting
      # pycc.build is injected by the harness (the packages use other backends).
      - name: Real packages built into wheels by pip with pycc.build
        run: |
          name=pycc-ci-$(uname -m)-linux
          python3 bench/wheel_check.py diff-match-patch tomli pypng \
            --pycc "dist/$name/bin/pycc" --backend "dist/$name/python"
      # Includes the hosted tests that build against and compare with the
      # CPython found as `python3` (the oracle). Skipped: the static-libpython
      # tests (need a relocatable CPython with a PIC `libpython3.X.a`) and the
      # nbody speed gate (timing on a shared runner).
      # scripts/ci_test.sh: no fail-fast; on failure the failed tests and their
      # panics go to the job summary, and each is rerun alone with a backtrace
      # into the ci-logs artifact.
      - name: Tests
        run: >-
          scripts/ci_test.sh --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      # Real-world gate: every corpus program must compile in non-strict mode and
      # print exactly what CPython prints (wrong output = miscompilation).
      - name: Corpus (non-strict)
        run: scripts/ci_corpus.sh -j 4 --flags=--non-strict --require-correct
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs-${{ matrix.os }}
          path: ci-logs
          if-no-files-found: ignore
      # Differential fuzzing smoke (v0.6 accept 4; .github/workflows/fuzz.yml runs
      # 30 minutes nightly): two minutes of generated programs, each compared with
      # CPython in every build mode; any mismatch or compiler crash fails the job.
      - name: Differential fuzzing smoke
        if: matrix.os == 'ubuntu-24.04'
        run: python3 fuzz/fuzz.py --seconds 120 -j 4 --seed 1 --reduce-seconds 120 --findings fuzz-findings
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.os == 'ubuntu-24.04'
        with:
          name: fuzz-smoke-findings
          path: fuzz-findings
          if-no-files-found: ignore
      # Real-package gates (v0.3 accept 4, v0.4 accept 4, v0.5 accept 2):
      # diff-match-patch and pypng (sdist sha256) and tomli (GitHub tag archive
      # sha256, and that of the files used), each built module by module with
      # --ext --non-strict, and each package's own test suite run by CPython
      # against the compiled modules. Compile speed (v0.5 accept 4): each
      # package builds in 10 s at most (the time is printed per module).
      - name: Real packages (diff-match-patch, tomli, pypng) against their own tests
        if: matrix.os == 'ubuntu-24.04'
        run: python3 bench/package_check.py diff-match-patch tomli pypng --time --runs 1 --max-build-seconds 10
      # Hot-path instruction counts under callgrind (stable on a shared runner,
      # unlike wall time): each package's hot path executes at most its
      # documented bound per call (`max_instructions` in bench/package_check.py,
      # 5% above the count on this runner with this CPython).
      - name: Real packages' hot-path instruction counts
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y -q valgrind
          python3 bench/package_check.py diff-match-patch tomli pypng --instructions
      # Compile speed (v0.5 accept 4): `pycc build` of every bench/py program
      # takes 2 s at most.
      - name: Benchmark programs build in 2 s
        if: matrix.os == 'ubuntu-24.04'
        run: python3 bench/run.py --build-only --max-build-seconds 2
  macos:
    # Apple silicon, macOS 26 -- the newest arm64 image GitHub hosts; macOS 26
    # is also the minimum the binaries target (README).
    if: ${{ !inputs.windows_only }}
    runs-on: macos-26
    env: { MACOSX_DEPLOYMENT_TARGET: "26.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # numpy for the hosted numpy tests and benchmarks, pinned by version and
      # wheel hash.
      - run: "python3 -m pip install --only-binary=:all: --require-hashes -r .github/numpy-requirements.txt"
      - name: Install LLVM 22
        run: scripts/macos_llvm.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # The release archive as release.yml builds it (no tag here), unpacked
      # and smoke-tested, so a macOS packaging break shows up before a release.
      - name: Package and smoke-test the release archive
        run: |
          scripts/package.sh dist/pycc-ci-aarch64-macos
          tar -C dist -czf dist/pycc-ci-aarch64-macos.tar.gz pycc-ci-aarch64-macos
          smoke=$(mktemp -d)
          tar -C "$smoke" -xzf dist/pycc-ci-aarch64-macos.tar.gz
          pkg="$smoke/pycc-ci-aarch64-macos"
          otool -L "$pkg/bin/pycc"
          vtool -show-build "$pkg/bin/pycc"
          codesign --verify --verbose "$pkg/bin/pycc"
          scripts/smoke.sh "$pkg"
      # As on Linux: each real package's wheel built by pip through the
      # archive's pycc.build backend, installed, and its own tests run.
      - name: Real packages built into wheels by pip with pycc.build
        run: |
          python3 bench/wheel_check.py diff-match-patch tomli pypng \
            --pycc dist/pycc-ci-aarch64-macos/bin/pycc --backend dist/pycc-ci-aarch64-macos/python
      # Same skips and failure reporting as the Linux job.
      - name: Tests
        run: >-
          scripts/ci_test.sh --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      - name: Corpus (non-strict)
        run: scripts/ci_corpus.sh -j 4 --flags=--non-strict --require-correct
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs-macos
          path: ci-logs
          if-no-files-found: ignore
  windows:
    # x86_64 Windows with the MSVC toolchain (ROADMAP v0.7 accept 1).
    # The port is in progress: until this job is green it reports without
    # gating (remove continue-on-error then).
    continue-on-error: true
    runs-on: windows-2025
    timeout-minutes: 240
    # Git Bash, so the same scripts as on Linux and macOS run here.
    defaults: { run: { shell: bash } }
    # The CPython oracle in UTF-8 mode: piped, it would otherwise encode
    # stdout in the ANSI code page, where pycc's programs write UTF-8
    # (docs/DEVIATIONS.md).
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # The tests and scripts run the oracle as `python3`; the Windows
      # install may only provide python.exe.
      - name: CPython 3.13 as python3
        run: |
          py_dir=$(cygpath -u "$pythonLocation")
          [ -e "$py_dir/python3.exe" ] || cp "$py_dir/python.exe" "$py_dir/python3.exe"
          python3 -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          python3 -c "import os, sys; p = os.path.join(sys.base_prefix, 'libs', 'python3.lib'); sys.exit(0 if os.path.isfile(p) else 'missing ' + p)"
      - run: "python3 -m pip install --only-binary=:all: --require-hashes -r .github/numpy-requirements.txt"
      # The MSVC developer environment (what vcvarsall.bat sets: LIB, INCLUDE,
      # VCToolsInstallDir, ...): Rust's and pycc's links need it.
      - uses: ilammy/msvc-dev-cmd@v1
      # Git Bash puts its coreutils `link.exe` ahead of MSVC's on PATH, so
      # cargo is given MSVC's linker by absolute path. (pycc's own driver,
      # clang, finds MSVC's through VCToolsInstallDir.)
      - name: MSVC link.exe for cargo
        shell: pwsh
        run: |
          $link = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $link)) { Write-Error "no $link"; exit 1 }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" >> $env:GITHUB_ENV
      - name: Install LLVM 22
        run: scripts/windows_llvm.sh
      - uses: Swatinem/rust-cache@v2
      - id: build
        run: cargo build --release
      # TEMPORARY (Windows port): which libraries an embedded build's link searches.
      - name: Debug embedded link
        continue-on-error: true
        run: |
          which -a clang || true
          printf 'import json\nprint(json.dumps(1))\n' > dbg.py
          real=$(cygpath -w "$(command -v clang)")
          printf '@"%s" -v -Wl,/VERBOSE:LIB %%*\r\n' "$real" > clangv.bat
          PYCC_CLANG=$(cygpath -w "$PWD/clangv.bat") target/release/pycc.exe build dbg.py -o dbg > dbg.log 2>&1 || true
          grep -iE 'libucrt|libcmt|defaultlib|Searching|link.exe|clang.*-cc1|error' dbg.log | cut -c1-600 | head -150
      # The release archive as release.yml builds it (no tag here), unpacked
      # and smoke-tested.
      - name: Package and smoke-test the release archive
        run: |
          name=pycc-ci-x86_64-windows
          scripts/package.sh dist/$name
          (cd dist && python3 -m zipfile -c $name.zip $name)
          smoke=$(mktemp -d)
          python3 -m zipfile -e dist/$name.zip "$smoke"
          scripts/smoke.sh "$smoke/$name"
      - name: Real packages built into wheels by pip with pycc.build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 bench/wheel_check.py diff-match-patch tomli pypng \
            --pycc dist/pycc-ci-x86_64-windows/bin/pycc.exe --backend dist/pycc-ci-x86_64-windows/python
      - name: Real packages (diff-match-patch, tomli, pypng) against their own tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 bench/package_check.py diff-match-patch tomli pypng
      # Same skips and failure reporting as the Linux job.
      - name: Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          scripts/ci_test.sh --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      - name: Corpus (non-strict)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci_corpus.sh -j 4 --flags=--non-strict --require-correct
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs-windows
          path: ci-logs
          if-no-files-found: ignore
