name: release-delete
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to delete (release + tag), e.g. v0.1.0-rc.1"
        required: true
permissions:
  contents: write
jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete pre-release
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", GH_REPO: "${{ github.repository }}" }
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "only pre-release tags (vX.Y.Z-suffix) may be deleted"; exit 1
          fi
          gh release delete "$TAG" --yes --cleanup-tag
