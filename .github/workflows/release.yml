name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env: { LLVM_SYS_221_PREFIX: /usr/lib/llvm-22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q && sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 libzstd-dev
      - run: cargo test --release --workspace
      - name: Package
        run: |
          name=pycc-${GITHUB_REF_NAME}-x86_64-linux
          mkdir -p dist/$name && cp target/release/pycc README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          sha256sum dist/$name.tar.gz > dist/$name.tar.gz.sha256
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=$(awk '/^## \['"${GITHUB_REF_NAME#v}"'\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "pycc-next $GITHUB_REF_NAME" --notes "$notes"
