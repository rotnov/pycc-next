name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
# Read-only by default; only the final publish job can write.
permissions:
  contents: read
jobs:
  # Tests, packages and smoke-tests one archive per platform. Read-only: these
  # jobs run third-party actions and the whole test suite.
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v0') || startsWith(github.ref, 'refs/tags/v1')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, platform: x86_64-linux }
          # GitHub's arm64 Linux runner (same Ubuntu 24.04 and LLVM 22 from
          # apt.llvm.org as the x86_64 leg).
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          # Apple silicon, macOS 26 (the minimum the archive supports).
          - { os: macos-26, platform: aarch64-macos, macos_target: "26.0" }
          # x86_64 Windows, MSVC toolchain; a .zip archive.
          - { os: windows-2025, platform: x86_64-windows }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    env:
      PLATFORM: "${{ matrix.platform }}"
      MACOSX_DEPLOYMENT_TARGET: "${{ matrix.macos_target }}"
    # Git Bash on Windows, so every platform runs the same scripts.
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # As in ci.yml's Windows job: CPython as `python3`, the MSVC developer
      # environment, MSVC's link.exe for cargo, and LLVM's own release.
      - name: CPython 3.13 as python3 (Windows)
        if: runner.os == 'Windows'
        run: |
          py_dir=$(cygpath -u "$pythonLocation")
          [ -e "$py_dir/python3.exe" ] || cp "$py_dir/python.exe" "$py_dir/python3.exe"
          python3 -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: MSVC link.exe for cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $link)) { Write-Error "no $link"; exit 1 }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" >> $env:GITHUB_ENV
      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        run: scripts/windows_llvm.sh
      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q && sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 libzstd-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: scripts/macos_llvm.sh
      - name: Resolve tag
        env: { INPUT_VERSION: "${{ inputs.version }}" }
        run: scripts/release_tag.sh
      - run: >-
          cargo test --release --workspace -- --include-ignored
          --skip a_real_static_libpython --skip nbody_release_binary_meets_required_speedup
      # A .tar.gz, or a .zip on Windows; each with its sha256.
      - name: Package
        run: |
          name=pycc-${TAG}-${PLATFORM}
          scripts/package.sh dist/$name
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && python3 -m zipfile -c $name.zip $name && sha256sum $name.zip > $name.zip.sha256)
          else
            tar -C dist -czf dist/$name.tar.gz $name
            (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
          fi
      # Unpack the archive elsewhere and use it like a user would (cleared
      # environment, no checkout paths): native, --ext and --non-strict
      # builds must match CPython before anything is published.
      - name: Smoke-test the archive
        run: |
          name=pycc-${TAG}-${PLATFORM}
          smoke=$(mktemp -d)
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && sha256sum -c $name.zip.sha256)
            python3 -m zipfile -e dist/$name.zip "$smoke"
          else
            (cd dist && shasum -a 256 -c $name.tar.gz.sha256)
            tar -C "$smoke" -xzf dist/$name.tar.gz
          fi
          scripts/smoke.sh "$smoke/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pycc-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # Publishes every platform's archive in one release, only after all of them
  # passed. The only write-scoped job: GitHub's own actions and `gh` only, and
  # nothing from the build jobs is executed -- the archives are only hashed
  # and uploaded.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v0') || startsWith(github.ref, 'refs/tags/v1')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        env: { INPUT_VERSION: "${{ inputs.version }}" }
        run: scripts/release_tag.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: pycc-*
          path: dist
          merge-multiple: true
      - name: Verify the archives
        run: |
          cd dist
          for name in pycc-${TAG}-x86_64-linux.tar.gz pycc-${TAG}-aarch64-linux.tar.gz \
              pycc-${TAG}-aarch64-macos.tar.gz pycc-${TAG}-x86_64-windows.zip; do
            [ -f "$name" ] && [ -f "$name.sha256" ] || { echo "missing $name"; exit 1; }
            sha256sum -c "$name.sha256"
          done
          ls -l
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=$(awk -v ver="${TAG#v}" 'index($0, "## [" ver "]")==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" $pre \
            --title "pycc-next $TAG" --notes "$notes"
