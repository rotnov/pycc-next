name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v0') || startsWith(github.ref, 'refs/tags/v1')
    runs-on: ubuntu-24.04
    env: { LLVM_SYS_221_PREFIX: /usr/lib/llvm-22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -q && sudo apt-get install -y -q llvm-22-dev libpolly-22-dev clang-22 libzstd-dev
      - run: cargo test --release --workspace
      - name: Resolve tag
        env: { INPUT_VERSION: "${{ inputs.version }}" }
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "bad tag"; exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Package
        run: |
          name=pycc-${TAG}-x86_64-linux
          mkdir -p dist/$name && cp target/release/pycc README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          sha256sum dist/$name.tar.gz > dist/$name.tar.gz.sha256
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=$(awk -v ver="${TAG#v}" 'index($0, "## [" ver "]")==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 --target "$GITHUB_SHA" $pre \
            --title "pycc-next $TAG" --notes "$notes"
