name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned per D-014 / TESTING.md "Code coverage" -- never a bare "latest".
  CARGO_LLVM_COV_VERSION: "0.8.7"
  # D-015 pin, installed identically (same exact version) on every OS below.
  LLVM_VERSION: "22.1.1"

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compiler: ${{ steps.classify.outputs.compiler }}
      pages: ${{ steps.classify.outputs.pages }}
      agent: ${{ steps.classify.outputs.agent }}
    steps:
      - name: Check out exact event head with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify exact changed paths
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "unsupported CI event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          for revision in "$base_sha" "$head_sha"; do
            if ! printf '%s\n' "$revision" | grep -Eq '^[0-9a-f]{40}$' ||
               [ "$revision" = "0000000000000000000000000000000000000000" ]; then
              echo "could not resolve exact CI base/head revisions" >&2
              exit 1
            fi
            git cat-file -e "${revision}^{commit}"
          done
          git diff --no-renames --name-only --diff-filter=ACDMRTUXB -z "$base_sha" "$head_sha" |
            python3 -B scripts/classify_ci_changes.py \
              --event-name "$GITHUB_EVENT_NAME" \
              --github-output "$GITHUB_OUTPUT"

  governance:
    needs: classify-changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check agent policy
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B scripts/validate_agent_policies.py

      - name: Check workflow permission policy
        run: |
          ruby scripts/test_check_ci_permissions.rb
          ruby scripts/check_ci_permissions.rb

      - name: Check roadmap evidence
        run: |
          ruby scripts/test_check_roadmap_evidence.rb
          ruby scripts/check_roadmap_evidence.rb

      - name: Check conformance breadth contract (issue #595)
        run: python3 -B scripts/check_conformance_breadth.py

      - name: Check scratch-directory usage (issue #781)
        run: python3 -B scripts/check_scratch_dir_usage.py

      - name: Check README coverage badge binding (issue #211)
        run: |
          ruby scripts/check_readme_coverage_badge.rb
          ruby scripts/test_check_readme_coverage_badge.rb

      - name: Install LLVM 22 for offline alpha skill contract evals
        if: needs.classify-changes.outputs.agent == 'true'
        timeout-minutes: 5
        run: |
          # apt.llvm.org has been observed to wedge ubuntu-latest (x86_64)
          # runners for hours with no failure signal (issue #614). Bound
          # both the download itself and the whole step so a stalled mirror
          # fails fast and the job can simply be re-run, instead of
          # consuming CI capacity for hours.
          wget --timeout=30 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # llvm.sh's own packages don't pull in Polly's static lib; llvm-sys
          # links it explicitly, so it must be installed separately here.
          sudo apt-get install -y libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: cargo build --workspace for offline alpha skill contract evals
        if: needs.classify-changes.outputs.agent == 'true'
        run: cargo build --workspace

      - name: Run offline alpha skill contract evals
        if: needs.classify-changes.outputs.agent == 'true'
        run: |
          python3 scripts/run_alpha_skill_evals.py \
            --client codex --pycc-bin target/debug/pycc
          python3 scripts/run_alpha_skill_evals.py \
            --client claude --pycc-bin target/debug/pycc

  # Coverage gate lives on exactly one target, per D-014 ("at least one
  # Tier-1 target"). This job also builds/tests/lints -- it's the primary
  # dev host's own architecture (macOS arm64), unchanged from PR-1/PR-2.
  build-test-coverage:
    needs: classify-changes
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show

      - name: Install LLVM 22 (D-015)
        run: brew install llvm@22

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      # tests/slice0.rs's cross-compilation test needs this target and its
      # pycc_rt build for the success path to contribute to coverage.
      - name: Add x86_64-apple-darwin Rust target
        run: rustup target add x86_64-apple-darwin

      # Hard merge invariant from D-014. These thresholds must never be
      # lowered or bypassed to make a pull request pass. tests/conformance.rs
      # (PR-6, D-078) is excluded from this measurement automatically -- test
      # code isn't part of the coverage denominator (docs/TESTING.md's "Code
      # coverage" section) -- and its two tests are `#[ignore]`d by default,
      # so this step needs no CPython oracle at all; see the oracle-setup
      # steps and explicit `--include-ignored` run further down this job.
      - name: Hard coverage gate — 100% lines + regions (D-014)
        run: |
          set -euo pipefail
          LLVM_SYS_221_PREFIX_VALUE="$(brew --prefix llvm@22)"
          TRUSTED_CARGO="$(rustup which cargo)"
          TRUSTED_RUSTC="$(rustup which rustc)"
          TRUSTED_RUSTDOC="$(rustup which rustdoc)"
          TRUSTED_COV="/Users/runner/.cargo/bin/cargo-llvm-cov"
          TRUSTED_TOOLCHAIN="$(dirname "$(dirname "$TRUSTED_CARGO")")"
          cd "$RUNNER_TEMP"
          RUSTC="$TRUSTED_RUSTC" RUSTDOC="$TRUSTED_RUSTDOC" "$TRUSTED_CARGO" install cargo-llvm-cov --locked --version "${CARGO_LLVM_COV_VERSION}"
          "$TRUSTED_COV" llvm-cov --version
          sudo chmod o+x /Users/runner /Users/runner/.cargo /Users/runner/.cargo/bin /Users/runner/.rustup /Users/runner/.rustup/toolchains
          sudo chmod -R o+rX "$TRUSTED_TOOLCHAIN"
          sudo chmod o+rx "$TRUSTED_COV"
          ISOLATED_ROOT="$RUNNER_TEMP/pycc-coverage"
          mkdir -p "$ISOLATED_ROOT/home" "$ISOLATED_ROOT/tmp" "$ISOLATED_ROOT/cargo-home" "$ISOLATED_ROOT/target"
          sudo chown -R nobody:nobody "$ISOLATED_ROOT"
          ISOLATED_ENV=(
            "HOME=$ISOLATED_ROOT/home"
            "TMPDIR=$ISOLATED_ROOT/tmp/"
            "CARGO_HOME=$ISOLATED_ROOT/cargo-home"
            "CARGO_TARGET_DIR=$ISOLATED_ROOT/target"
            "CARGO=$TRUSTED_CARGO"
            "RUSTC=$TRUSTED_RUSTC"
            "RUSTDOC=$TRUSTED_RUSTDOC"
            "LLVM_SYS_221_PREFIX=$LLVM_SYS_221_PREFIX_VALUE"
            "PATH=$(dirname "$TRUSTED_CARGO"):/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"
          )
          run_isolated() {
            sudo -u nobody env -i "${ISOLATED_ENV[@]}" "$@"
          }
          ln -s "$ISOLATED_ROOT/target" "$GITHUB_WORKSPACE/target"
          cd "$GITHUB_WORKSPACE"
          run_isolated "$TRUSTED_CARGO" build --target x86_64-apple-darwin -p pycc_rt
          run_isolated "$TRUSTED_CARGO" build --workspace
          run_isolated "$TRUSTED_CARGO" build --release -p pycc_rt
          run_isolated "$TRUSTED_COV" llvm-cov --workspace --fail-under-lines 100 --fail-under-regions 100
          rm "$GITHUB_WORKSPACE/target"
          printf 'LLVM_SYS_221_PREFIX=%s\n' "$LLVM_SYS_221_PREFIX_VALUE" >> "$GITHUB_ENV"

      # Rebuild outside the coverage boundary so the regular cargo test below
      # exercises the same cross-target success path.
      - name: Build pycc_rt for x86_64-apple-darwin
        run: cargo build --target x86_64-apple-darwin -p pycc_rt

      # No separate `cargo build --workspace` step here (removed by #631,
      # part 3 of #20): pycc_codegen/build.rs now runs `cargo build -p
      # pycc_rt` itself as a real build dependency, so the plain `cargo
      # test --workspace` below already triggers the full workspace build
      # before it links and runs anything. A reintroduced missing build
      # dependency would fail this job again instead of hiding behind a
      # pre-built artifact.

      # tests/nbody_bench.rs's `#[ignore]`d benchmark builds its fixture with
      # `pycc build --release` (no `--target`), which links whatever
      # `pycc_rt` build lives in this host's own `target/release/` --
      # previously nothing built one here, so that lookup always silently
      # fell through to the debug-profile error path before D-091's fix to
      # `src/main.rs::find_pycc_rt_lib_dir`. `--include-ignored` below is
      # what actually exercises this.
      - name: Build pycc_rt (release, for tests/nbody_bench.rs's --release build)
        run: cargo build --release -p pycc_rt

      # tests/conformance.rs (PR-6, D-078) shells out to a hardcoded
      # "python3.14" oracle binary. Deliberately set up here, after the
      # coverage gate above rather than before it -- installing a
      # network-fetched interpreter inside that gate's isolated `nobody`
      # sandbox would expand a trust boundary that's reviewed and pinned
      # (scripts/check_roadmap_evidence.rb's TRUSTED_COVERAGE_STEPS /
      # COVERAGE_SCRIPT). Pinned to the exact same 3.14.7 the local oracle
      # uses (docs/ROADMAP.md's "v1 stable oracle" row).
      - name: Set up CPython 3.14.7 conformance oracle
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Verify oracle version
        shell: bash
        run: |
          python3.14 --version | grep -qx "Python 3.14.7" || {
            echo "::error::expected python3.14 --version to print exactly 'Python 3.14.7'"
            python3.14 --version
            exit 1
          }

      # Both conformance tests are `#[ignore]`d by default (see
      # tests/conformance.rs) so the coverage gate above doesn't need the
      # oracle; `--include-ignored` here is what actually runs and verifies
      # them, now that the oracle is on PATH.
      - name: cargo test --workspace (incl. ignored conformance tests, D-078)
        run: cargo test --workspace -- --include-ignored

      # Absolute wall-clock floor for `pycc check` (D-079), not a
      # regression-vs-predecessor comparison like frontend-perf-gate.
      # Placed after the cargo-test step above (not right after cargo
      # build) so this measurement is never the first exec of the
      # freshly-linked binary in this job -- an early first-exec can
      # carry one-time cold-start/code-signature-validation overhead
      # unrelated to pycc's own compute, which would make this check
      # measure process-spawn noise instead of `pycc check`'s speed.
      - name: Check pycc check throughput floor (<75ms/1000 LOC, D-084)
        run: ruby scripts/check_frontend_throughput.rb target/debug/pycc tests/fixtures/pr6_1000_loc_bench.py 75

      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  # PR-3: native build+test+lint on the other 4 Tier-1 targets. No coverage
  # requirement here -- that's build-test-coverage's job alone, per D-014.
  native-build-test:
    needs: classify-changes
    if: needs.classify-changes.outputs.compiler == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show

      # rustc/link.exe already discover the MSVC toolset on their own, but
      # pycc's own linking step (src/main.rs's linker_command(), D-028) shells
      # out to clang.exe directly -- outside any Developer Command Prompt,
      # its bundled lld-link.exe can't find libcmt.lib/oldnames.lib (D-028).
      # This sets up the same environment vcvarsall.bat would.
      - name: Set up MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install LLVM 22 (Linux, via apt.llvm.org)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # apt.llvm.org has been observed to wedge ubuntu-latest (x86_64)
          # runners for hours with no failure signal (issue #614). Bound
          # both the download itself and the whole step so a stalled mirror
          # fails fast and the job can simply be re-run, instead of
          # consuming CI capacity for hours.
          wget --timeout=30 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # llvm.sh's own packages don't pull in Polly's static lib; llvm-sys
          # links it explicitly, so it must be installed separately here.
          sudo apt-get install -y libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      # tests/slice0.rs's own-triple --target test (D-031) needs a
      # target-qualified pycc_rt build to link against, exactly like the
      # macOS cross-compile tests already need for x86_64-apple-darwin --
      # `cargo build --target <triple>` always uses target/<triple>/debug/,
      # even when <triple> is this same runner's own default.
      - name: Add own-triple Rust target (Linux, D-031)
        if: runner.os == 'Linux'
        run: rustup target add ${{ matrix.target }}

      - name: Build pycc_rt for own triple (Linux, D-031)
        if: runner.os == 'Linux'
        run: cargo build --target ${{ matrix.target }} -p pycc_rt

      - name: Install LLVM 22 (macOS, via Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      # Downloaded directly from LLVM's own GitHub release (not a third-party
      # mirror or package manager) -- no Windows package manager reliably
      # carries LLVM 22 yet, checked before choosing this.
      - name: Install LLVM 22 (Windows, official prebuilt release)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --fail -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          # $RUNNER_TEMP is a native Windows path (e.g. D:\a\_temp); passing
          # it straight into bash's tar/mkdir mangles the backslashes. Use a
          # plain repo-relative dir for the bash-side extraction, then
          # cygpath -w it into a real Windows path only for the env var,
          # since that's what the (native) build.rs consuming it expects.
          mkdir -p llvm-extract
          tar -xf llvm.tar.xz -C llvm-extract --strip-components=1
          echo "LLVM_SYS_221_PREFIX=$(cygpath -w "$(pwd)/llvm-extract")" >> "$GITHUB_ENV"

      # D-099: the hosted image's exact vcpkg commit participates in the
      # outer GitHub cache key. vcpkg's own ABI hash still validates each
      # archive, while the outer key also rotates when the hosted image,
      # LLVM, triplet, runner architecture, or vcpkg baseline changes.
      - name: Configure vcpkg binary cache identity (Windows)
        id: vcpkg_cache_identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgCommit = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $vcpkgCommit -notmatch '^[0-9a-f]{40}$') {
            Write-Error "could not resolve the hosted runner's exact vcpkg commit"
            exit 1
          }
          $imageVersion = $env:ImageVersion
          if ($null -eq $imageVersion -or $imageVersion -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') {
            Write-Error "could not resolve a safe hosted runner image version"
            exit 1
          }
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "vcpkg_commit=$vcpkgCommit" >> $env:GITHUB_OUTPUT
          "image_version=$imageVersion" >> $env:GITHUB_OUTPUT
          "cache_path=$cacheDir" >> $env:GITHUB_OUTPUT
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV

      - name: Restore vcpkg libxml2 binary cache (Windows)
        id: vcpkg_libxml2_cache_restore
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg_cache_identity.outputs.cache_path }}
          key: vcpkg-libxml2-${{ runner.os }}-${{ runner.arch }}-image-${{ steps.vcpkg_cache_identity.outputs.image_version }}-llvm-${{ env.LLVM_VERSION }}-x64-windows-static-md-${{ steps.vcpkg_cache_identity.outputs.vcpkg_commit }}

      # This LLVM release's own llvm-config reports libxml2 as a system lib
      # (see D-027), so llvm-sys requires a real xml2s.lib to link -- vcpkg
      # is preinstalled on GitHub's Windows runners (path varies by image,
      # hence the env var rather than a hardcoded one). static-md matches
      # Rust's own default dynamic-CRT linkage on this target.
      - name: Install libxml2 (Windows, via vcpkg, for llvm-sys's system-libs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libxml2:x64-windows-static-md
          $libDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib"
          $xml2Lib = Get-ChildItem -Path $libDir -Filter "*xml2*.lib" | Select-Object -First 1
          if (-not $xml2Lib) {
            Write-Error "no libxml2 .lib found under $libDir"
            exit 1
          }
          Copy-Item $xml2Lib.FullName "$libDir\xml2s.lib" -Force
          echo "LIB=$libDir;$env:LIB" >> $env:GITHUB_ENV

      # Pull requests can restore the default branch's cache but cannot
      # publish one. Only trusted main pushes seed a missing exact key.
      - name: Save vcpkg libxml2 binary cache (Windows main only)
        if: >-
          runner.os == 'Windows' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.vcpkg_libxml2_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg_cache_identity.outputs.cache_path }}
          key: ${{ steps.vcpkg_libxml2_cache_restore.outputs.cache-primary-key }}

      # tests/conformance.rs (PR-6, D-078) shells out to a hardcoded
      # "python3.14" oracle binary via cargo test --workspace below, on every
      # Tier-1 target alike -- pinned here to the exact same 3.14.7 the local
      # oracle uses (docs/ROADMAP.md's "v1 stable oracle" row).
      - name: Set up CPython 3.14.7 conformance oracle
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      # actions/setup-python only produces a plain "python.exe" on Windows --
      # unlike its Unix installs, it never creates a version-suffixed
      # "python3.14" binary. tests/conformance.rs's oracle lookup uses that
      # one hardcoded name uniformly on every Tier-1 target (D-078), so this
      # copies the just-installed interpreter under the name it expects
      # rather than special-casing the Rust lookup itself for one platform.
      # Resolved via $pythonLocation (the exact directory actions/setup-python
      # itself exports and prepends to the real Windows PATH), not bash's own
      # `command -v python` -- Git Bash's PATH view can be reordered relative
      # to the real Windows PATH that later `pwsh`-run steps (and the Rust
      # test binary's own Command::new PATH search) actually search, so a
      # bash-resolved "python" is not guaranteed to be the same interpreter.
      - name: Alias python3.14 (Windows lacks a version-suffixed python binary)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PY_DIR="$(cygpath -u "$pythonLocation")"
          cp "$PY_DIR/python.exe" "$PY_DIR/python3.14.exe"

      - name: Verify oracle version
        shell: bash
        run: |
          python3.14 --version | grep -qx "Python 3.14.7" || {
            echo "::error::expected python3.14 --version to print exactly 'Python 3.14.7'"
            python3.14 --version
            exit 1
          }

      # No separate `cargo build --workspace` step here (removed by #631,
      # part 3 of #20): pycc_codegen/build.rs now runs `cargo build -p
      # pycc_rt` itself as a real build dependency, so the plain `cargo
      # test --workspace` below already triggers the full workspace build
      # before it links and runs anything.

      # Same D-091 need as build-test-coverage's own identically-named step
      # above: tests/nbody_bench.rs's `pycc build --release` (no `--target`)
      # links this host's own `target/release/pycc_rt`, which nothing built
      # on this leg before this step existed.
      - name: Build pycc_rt (release, for tests/nbody_bench.rs's --release build)
        run: cargo build --release -p pycc_rt

      # `--include-ignored` runs tests/conformance.rs's two `#[ignore]`d
      # tests (D-078) alongside everything else, now that the oracle above
      # is on PATH.
      - name: cargo test --workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace -- --include-ignored

      # --test-threads=1: tests/slice0.rs spawns pycc.exe as a child process
      # per test; parallel runs interleave their stderr output at the OS
      # pipe level (Rust's own per-test output capture doesn't isolate
      # inherited child-process output the same way), which made an earlier
      # Windows-crash investigation (D-029) hard to attribute to specific
      # tests from the CI log alone. Serialized here so that if this ever
      # needs repeating, the log is unambiguous; not needed on other OSes.
      - name: cargo test --workspace (single-threaded, see D-029)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --test-threads=1 --include-ignored

      # No explicit `shell:` here (unlike this step used to have) -- on
      # Windows that forced Git Bash, whose own `PATH` startup rewriting
      # puts its bundled coreutils `link.exe` (the Unix hardlink tool, at
      # `C:\Program Files\Git\usr\bin\link.exe`) ahead of MSVC's real
      # linker, breaking any proc-macro dependency's build with a bizarre
      # "extra operand" error from what is very much not a linker (D-030).
      # `cargo build`/`cargo test` above already run correctly on Windows
      # using each OS's own default shell (pwsh here) with no override;
      # this step's two commands have no bash-specific syntax, so dropping
      # the override fixes Windows and changes nothing on Linux/macOS
      # (already bash by default there).
      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  # PR-3's cross-compilation proof (D-026): pycc, running natively on the
  # arm64 runner, cross-compiles for x86_64-apple-darwin using its own
  # --target flag -- same-OS/cross-arch, not cross-OS (see D-026 for why).
  cross-compile-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install LLVM 22
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Add x86_64-apple-darwin Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build pycc_rt for x86_64-apple-darwin
        run: cargo build --target x86_64-apple-darwin -p pycc_rt

      - name: Build pycc (native)
        run: cargo build -p pycc

      - name: Cross-compile the slice-0 fixture
        run: |
          mkdir -p /tmp/cross_fixture
          printf 'print(42)\n' > /tmp/cross_fixture/hello.py
          ./target/debug/pycc build /tmp/cross_fixture/hello.py -o /tmp/cross_fixture/hello --target x86_64-apple-darwin
          file /tmp/cross_fixture/hello

      - name: Upload the cross-compiled binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-compiled-x86_64-apple-darwin
          path: /tmp/cross_fixture/hello

  # Verifies the cross-compiled binary on its own native hardware -- "built
  # on one host, executed and verified on its native runner" per
  # docs/DELIVERY_PLAN.md's PR-3 row, not just "codegen didn't error."
  cross-compile-verify:
    needs:
      - classify-changes
      - cross-compile-build
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: macos-15-intel
    steps:
      - name: Download the cross-compiled binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cross-compiled-x86_64-apple-darwin
          path: /tmp/cross_fixture

      - name: Verify it runs natively and prints the right output
        run: |
          chmod +x /tmp/cross_fixture/hello
          file /tmp/cross_fixture/hello
          output="$(/tmp/cross_fixture/hello)"
          if [ "$output" != "42" ]; then
            echo "expected '42', got '${output}'"
            exit 1
          fi
          echo "cross-compiled binary verified on its native x86_64 runner"

  # Single stable required-status-check name fanning in every job in this
  # workflow (D-032): branch protection previously required only
  # build-test-coverage + audit, so a failing/pending native-build-test leg
  # or cross-compile-build/verify could not block a merge -- SPEC.md's own
  # invariant 5 ("a feature doesn't exist until it's green everywhere") was
  # unenforced for exactly the jobs that prove it. Naming individual matrix
  # legs directly in branch protection was rejected: GitHub's required-check
  # name for a matrix job bakes in the matrix values (e.g. "native-build-test
  # (ubuntu-latest, x86_64-unknown-linux-gnu)"), so renaming an `os`/`target`
  # entry -- or adding a new Tier-1/Tier-2 target later -- would silently
  # leave an old, now-nonexistent name required forever (permanently
  # unsatisfiable) while the new leg goes unenforced. This job's own name
  # never changes regardless of matrix edits.
  # The measurement job eventually executes pull-request code and is
  # therefore untrusted. It seals the exact predecessor timing in an immutable
  # artifact before candidate code runs, then measures the candidate on the
  # same hosted runner. It also proves whether every executable benchmark input
  # is byte-identical before candidate code runs. Five fixed complete samples
  # per revision make an isolated runner spike non-decisive when those inputs
  # changed, without selecting retries after seeing a result. The separate gate
  # job never executes compiler/build code from the PR.
  frontend-perf-measure:
    needs: classify-changes
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      predecessor_sha: ${{ steps.predecessor.outputs.sha }}
      predecessor_artifact_id: ${{ steps.previous_upload.outputs.artifact-id }}
      current_artifact_id: ${{ steps.current_upload.outputs.artifact-id }}
      executable_inputs_equal: ${{ steps.benchmark_contract.outputs.executable_inputs_equal }}
    steps:
      - name: Resolve exact predecessor
        id: predecessor
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              predecessor_sha="$PR_BASE_SHA"
              ;;
            push)
              predecessor_sha="$PUSH_BEFORE_SHA"
              ;;
            *)
              echo "cannot resolve a performance predecessor for event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ -z "$predecessor_sha" ] ||
             [ "$predecessor_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "cannot resolve the exact performance predecessor SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$predecessor_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ steps.predecessor.outputs.sha }}
          path: previous

      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: current

      - name: Verify exact benchmark revisions
        env:
          EXPECTED_PREDECESSOR_SHA: ${{ steps.predecessor.outputs.sha }}
          EXPECTED_CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C previous rev-parse HEAD)" = "$EXPECTED_PREDECESSOR_SHA"
          test "$(git -C current rev-parse HEAD)" = "$EXPECTED_CURRENT_SHA"
          contract_paths=(
            benches
            rust-toolchain.toml
            rust-toolchain
            .cargo
          )
          for contract_path in "${contract_paths[@]}"; do
            previous_path="previous/$contract_path"
            current_path="current/$contract_path"
            if [ ! -e "$previous_path" ] && [ ! -L "$previous_path" ] &&
               [ ! -e "$current_path" ] && [ ! -L "$current_path" ]; then
              continue
            fi
            git diff --no-index --exit-code -- "$previous_path" "$current_path"
          done
          # D-091: root Cargo.toml's bench-defining tail ([dev-dependencies]
          # onward, which today is exactly [dev-dependencies] plus [[bench]])
          # stays part of this hard contract even though the rest of the
          # manifest is reclassified below -- see "Classify executable
          # benchmark inputs"' own comment. Nothing below [dev-dependencies]
          # reaches the built pycc binary the benchmark times, so relaxing
          # it would let a faster measuring apparatus (a bumped criterion, a
          # rewritten [[bench]] target) pass as a faster compiler. This is a
          # standalone check, not an addition to contract_paths above: it
          # extracts and diffs a sub-region of one file rather than
          # requiring a whole path byte-identical. Two invariants are
          # asserted, not assumed, so a future manifest edit cannot widen
          # or narrow the pinned region without a loud abort: (1)
          # [dev-dependencies] exists and only [[bench]] follows it, so an
          # unrelated section landing after [dev-dependencies] cannot be
          # silently swallowed into the pinned tail; (2) every [[bench]]
          # section in the file is inside that tail, so reordering
          # [[bench]] above [dev-dependencies] cannot silently move it out
          # of the pinned region and into the softer reclassification below.
          for repo_dir in previous current; do
            manifest="$repo_dir/Cargo.toml"
            if ! grep -q '^\[dev-dependencies\]$' "$manifest"; then
              echo "$manifest has no [dev-dependencies] section; bench-manifest fingerprint invariant violated" >&2
              exit 1
            fi
            extra_headers="$(awk '
              /^\[dev-dependencies\]$/ { found = 1 }
              found && /^\[/ && !/^\[dev-dependencies\]$/ && !/^\[\[bench\]\]$/ { print }
            ' "$manifest")"
            if [ -n "$extra_headers" ]; then
              echo "$manifest has unexpected section(s) after [dev-dependencies]: $extra_headers" >&2
              exit 1
            fi
            whole_bench_count="$(grep -c '^\[\[bench\]\]$' "$manifest" || true)"
            tail_bench_count="$(awk '/^\[dev-dependencies\]$/,0' "$manifest" | grep -c '^\[\[bench\]\]$' || true)"
            if [ "$whole_bench_count" != "$tail_bench_count" ]; then
              echo "$manifest has a [[bench]] section outside its [dev-dependencies]-onward tail; bench-manifest fingerprint invariant violated" >&2
              exit 1
            fi
          done
          # D-203: tolerate exactly one reviewed line -- the pycc_scratch root
          # dev-dependency -- in the [dev-dependencies]-onward tail; every other
          # tail difference still hard-aborts (D-091).
          diff <(awk '/^\[dev-dependencies\]$/,0' previous/Cargo.toml |
                 grep -vxF 'pycc_scratch = { path = "crates/pycc_scratch" }') \
               <(awk '/^\[dev-dependencies\]$/,0' current/Cargo.toml |
                 grep -vxF 'pycc_scratch = { path = "crates/pycc_scratch" }')

      # D-091: the dependency manifest (root Cargo.toml/Cargo.lock, and each
      # crate's own Cargo.toml/build.rs -- already covered by the plain
      # `crates` diff below) is just another kind of "did the code that
      # produces the benchmarked binary change," exactly like src/crates.
      # It is classified here, not hard-required identical above: a
      # dependency `pycc check` never invokes at runtime cannot confound
      # the comparison, and if a manifest change somehow did shift timing,
      # the same strict threshold applied to any other executable-input
      # change below would still catch it. Only `benches` (the corpus
      # itself), the toolchain/`.cargo`, and root Cargo.toml's own
      # bench-defining tail (see "Verify exact benchmark revisions" above)
      # measure genuinely incomparable work if they differ -- no numeric
      # threshold fixes that, which is why those stay a hard, unconditional
      # abort. Root-level build.rs is classified here (not hashed
      # separately) since Cargo would silently use it without any
      # Cargo.toml change; per-crate build.rs stays covered by the `crates`
      # path below.
      - name: Classify executable benchmark inputs
        id: benchmark_contract
        run: |
          set -euo pipefail
          executable_inputs_equal=true
          for executable_path in src crates Cargo.toml Cargo.lock build.rs; do
            previous_path="previous/$executable_path"
            current_path="current/$executable_path"
            if [ ! -e "$previous_path" ] && [ ! -L "$previous_path" ] &&
               [ ! -e "$current_path" ] && [ ! -L "$current_path" ]; then
              continue
            fi
            if git diff --no-index --no-ext-diff --no-textconv --quiet -- \
              "$previous_path" "$current_path"; then
              continue
            else
              diff_status="$?"
              if [ "$diff_status" -ne 1 ]; then
                echo "could not compare executable benchmark input $executable_path" >&2
                exit "$diff_status"
              fi
              executable_inputs_equal=false
            fi
          done
          printf 'executable_inputs_equal=%s\n' \
            "$executable_inputs_equal" >> "$GITHUB_OUTPUT"

      - name: Show pinned toolchain
        run: rustup show

      - name: Install LLVM 22 (Linux, via apt.llvm.org)
        timeout-minutes: 5
        run: |-
          # apt.llvm.org has been observed to wedge ubuntu-latest (x86_64)
          # runners for hours with no failure signal (issue #614). Bound
          # both the download itself and the whole step so a stalled mirror
          # fails fast and the job can simply be re-run, instead of
          # consuming CI capacity for hours.
          wget --timeout=30 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # llvm.sh's own packages don't pull in Polly's static lib; llvm-sys
          # links it explicitly, so it must be installed separately here.
          sudo apt-get install -y libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Benchmark exact predecessor
        id: previous_benchmark
        run: |
          set -euo pipefail
          previous_target="$RUNNER_TEMP/pycc-paired-perf-previous"
          timing_dir="$(mktemp -d "$RUNNER_TEMP/pycc-previous-timing.XXXXXX")"
          for round in 1 2 3 4 5; do
            baseline="replicate-$round"
            (
              cd previous
              CARGO_TARGET_DIR="$previous_target" \
                cargo bench --locked --bench check_bench -- --save-baseline "$baseline"
            )
            previous_timing="$previous_target/criterion/pycc_check_frontend_fixture/$baseline/estimates.json"
            cp "$previous_timing" "$timing_dir/round-$round.json"
          done
          printf 'timing_path=%s\n' "$timing_dir" >> "$GITHUB_OUTPUT"

      - name: Upload sealed predecessor frontend timing
        id: previous_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-perf-previous
          path: ${{ steps.previous_benchmark.outputs.timing_path }}
          if-no-files-found: error
          retention-days: 90

      # Candidate code cannot mutate the immutable v4 predecessor artifact:
      # this is deliberately after the sealed upload, not merely after a local
      # hash check in the same writable runner filesystem.
      - name: Benchmark exact candidate
        id: current_benchmark
        run: |
          set -euo pipefail
          current_target="$RUNNER_TEMP/pycc-paired-perf-current"
          timing_dir="$(mktemp -d "$RUNNER_TEMP/pycc-current-timing.XXXXXX")"
          for round in 1 2 3 4 5; do
            baseline="replicate-$round"
            (
              cd current
              CARGO_TARGET_DIR="$current_target" \
                cargo bench --locked --bench check_bench -- --save-baseline "$baseline"
            )
            current_timing="$current_target/criterion/pycc_check_frontend_fixture/$baseline/estimates.json"
            cp "$current_timing" "$timing_dir/round-$round.json"
          done
          printf 'timing_path=%s\n' "$timing_dir" >> "$GITHUB_OUTPUT"

      - name: Upload candidate frontend timing
        id: current_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-perf-current
          path: ${{ steps.current_benchmark.outputs.timing_path }}
          if-no-files-found: error
          retention-days: 90

  # Required by ci-gate (D-044/D-062). This job consumes the paired
  # measurement only as JSON data and verifies immutable hashes for the
  # reviewed comparator and its tests before executing them.
  frontend-perf-gate:
    needs:
      - classify-changes
      - frontend-perf-measure
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out only the reviewed performance checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.frontend-perf-measure.outputs.predecessor_sha }}
          sparse-checkout: |
            scripts/check_replicated_paired_perf_regression.rb
            scripts/test_check_replicated_paired_perf_regression.rb
          sparse-checkout-cone-mode: false

      - name: Verify reviewed performance checker
        run: |
          printf '%s  %s\n' \
            d296e48859b1813685f06244c6d401119de57ec1842fe7c47d8ecbbdb1318c06 \
            scripts/check_replicated_paired_perf_regression.rb \
            bdda7c21cf96d35ee00af6893493b9f84025b35998e5a4bcba88019604757b10 \
            scripts/test_check_replicated_paired_perf_regression.rb |
            shasum -a 256 --check

      - name: Test reviewed performance checker
        run: ruby scripts/test_check_replicated_paired_perf_regression.rb

      - name: Require sealed artifact identities
        env:
          PREVIOUS_ARTIFACT_ID: ${{ needs.frontend-perf-measure.outputs.predecessor_artifact_id }}
          CURRENT_ARTIFACT_ID: ${{ needs.frontend-perf-measure.outputs.current_artifact_id }}
        run: |
          set -euo pipefail
          for artifact_id in "$PREVIOUS_ARTIFACT_ID" "$CURRENT_ARTIFACT_ID"; do
            case "$artifact_id" in
              ""|*[!0-9]*)
                echo "paired frontend timing has an invalid artifact identity" >&2
                exit 1
                ;;
            esac
          done
          if [ "$PREVIOUS_ARTIFACT_ID" = "$CURRENT_ARTIFACT_ID" ]; then
            echo "paired frontend timings must have distinct artifact identities" >&2
            exit 1
          fi

      - name: Require executable-input identity
        env:
          EXECUTABLE_INPUTS_EQUAL: ${{ needs.frontend-perf-measure.outputs.executable_inputs_equal }}
        run: |
          case "$EXECUTABLE_INPUTS_EQUAL" in
            true|false) ;;
            *)
              echo "paired frontend timing has invalid executable-input identity" >&2
              exit 1
              ;;
          esac

      - name: Download sealed predecessor frontend timing
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.frontend-perf-measure.outputs.predecessor_artifact_id }}
          path: target/criterion/pycc_check_frontend_fixture/previous
          merge-multiple: true

      - name: Download candidate frontend timing
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.frontend-perf-measure.outputs.current_artifact_id }}
          path: target/criterion/pycc_check_frontend_fixture/current
          merge-multiple: true

      - name: Require exact predecessor and candidate timing
        run: |
          set -euo pipefail
          timing_root="target/criterion/pycc_check_frontend_fixture"
          for revision in previous current; do
            for round in 1 2 3 4 5; do
              timing="$timing_root/$revision/round-$round.json"
              if [ ! -f "$timing" ] || [ -L "$timing" ]; then
                echo "replicated frontend timing is missing $revision/round-$round.json" >&2
                exit 1
              fi
            done
          done
          file_count="$(find "$timing_root" -type f | wc -l | tr -d '[:space:]')"
          entry_count="$(find "$timing_root" -mindepth 1 | wc -l | tr -d '[:space:]')"
          if [ "$file_count" -ne 10 ] || [ "$entry_count" -ne 12 ] || \
              find "$timing_root" -type l | grep -q .; then
            echo "replicated frontend timing must contain exactly two directories and ten regular files" >&2
            exit 1
          fi

      - name: Compare exact predecessor and candidate
        env:
          EXECUTABLE_INPUTS_EQUAL: ${{ needs.frontend-perf-measure.outputs.executable_inputs_equal }}
        run: |
          ruby scripts/check_replicated_paired_perf_regression.rb \
            target/criterion/pycc_check_frontend_fixture/current \
            target/criterion/pycc_check_frontend_fixture/previous \
            "$EXECUTABLE_INPUTS_EQUAL" \
            "7.0"

  # Issue #229: hermetic Pages performance budget gate.  Runs on every
  # Pages-relevant pull request and push to main, unprivileged (contents: read only).
  # Uses a pinned Lighthouse 12.8.2 mobile profile against the hermetic
  # local server to enforce LCP/CLS/TBT/performance-score thresholds and
  # resource budgets.  No continue-on-error: failures propagate to
  # ci-gate, which requires this job's literal 'success'.
  pages-performance:
    needs: classify-changes
    if: needs.classify-changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run hermetic Lighthouse pages performance budget gate
        run: |
          python3 scripts/run_pages_lighthouse.py \
            --output-dir /tmp/lighthouse-results \
            --site-dir site
          ruby scripts/check_pages_performance_budget.rb \
            --lhr-dir /tmp/lighthouse-results

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: /tmp/lighthouse-results
          if-no-files-found: error
          retention-days: 90

  # Issue #199: hermetic site accessibility gate.  Runs on every
  # Pages-relevant pull request and push to main, unprivileged (contents: read only).
  # Uses a pinned Lighthouse 12.8.2 mobile accessibility profile, a
  # W3C Nu ARIA conformance evaluator, and a Puppeteer reduced-motion
  # evaluator against the hermetic local server.  No continue-on-error:
  # failures propagate to ci-gate, which requires this job's literal
  # 'success'.
  pages-accessibility:
    needs: classify-changes
    if: needs.classify-changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run hermetic Lighthouse accessibility gate
        run: |
          python3 scripts/run_pages_lighthouse_accessibility.py \
            --output-dir /tmp/lighthouse-a11y-results \
            --site-dir site
          ruby scripts/check_site_accessibility.rb \
            --lhr-dir /tmp/lighthouse-a11y-results \
            --site-dir site

      - name: Upload Lighthouse accessibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-a11y-reports
          path: /tmp/lighthouse-a11y-results
          if-no-files-found: error
          retention-days: 90

  rustfmt:
    needs: classify-changes
    if: needs.classify-changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show

      - name: "Check formatting (rustfmt gate, issue #24)"
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  ci-gate:
    needs:
      - classify-changes
      - governance
      - build-test-coverage
      - native-build-test
      - cross-compile-build
      - cross-compile-verify
      - frontend-perf-measure
      - frontend-perf-gate
      - pages-performance
      - pages-accessibility
      - rustfmt
    if: always()
    runs-on: ubuntu-latest
    # Overrides the workflow-level `contents: read` default: this job only
    # reads the `needs` context, never checks out or touches the repository,
    # so it gets none of that access rather than an unused inherited grant.
    permissions: {}
    steps:
      # The classifier and governance jobs must succeed. Every classifier
      # output must be a literal boolean, every selected optional job must
      # succeed, and every unselected optional job must be skipped.
      - name: Fail unless required jobs and exact routing succeeded
        if: >-
          needs.classify-changes.result != 'success' ||
          needs.governance.result != 'success' ||
          (needs.classify-changes.outputs.compiler != 'true' &&
           needs.classify-changes.outputs.compiler != 'false') ||
          (needs.classify-changes.outputs.pages != 'true' &&
           needs.classify-changes.outputs.pages != 'false') ||
          (needs.classify-changes.outputs.agent != 'true' &&
           needs.classify-changes.outputs.agent != 'false') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.build-test-coverage.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.build-test-coverage.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.native-build-test.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.native-build-test.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.cross-compile-build.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.cross-compile-build.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.cross-compile-verify.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.cross-compile-verify.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.frontend-perf-measure.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.frontend-perf-measure.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.frontend-perf-gate.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.frontend-perf-gate.result != 'skipped') ||
          (needs.classify-changes.outputs.pages == 'true' &&
           needs.pages-performance.result != 'success') ||
          (needs.classify-changes.outputs.pages == 'false' &&
           needs.pages-performance.result != 'skipped') ||
          (needs.classify-changes.outputs.pages == 'true' &&
           needs.pages-accessibility.result != 'success') ||
          (needs.classify-changes.outputs.pages == 'false' &&
           needs.pages-accessibility.result != 'skipped') ||
          (needs.classify-changes.outputs.compiler == 'true' &&
           needs.rustfmt.result != 'success') ||
          (needs.classify-changes.outputs.compiler == 'false' &&
           needs.rustfmt.result != 'skipped')
        run: |
          echo "required CI jobs or exact change routing did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
